<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#FFF7F5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="みつけたマップ">
<meta name="format-detection" content="telephone=no">
<title>みつけたマップ</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="vendor/markercluster/MarkerCluster.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header class="topbar">
    <h1 class="logo"><span class="c1">み</span><span class="c2">つ</span><span class="c3">け</span><span class="c4">た</span><span class="c5">マップ</span></h1>
    <button id="btn-menu" class="icon-btn" aria-label="メニュー">📖</button>
  </header>
  <nav id="filters" class="filters" aria-label="しぼりこみ"></nav>
  <main class="map-wrap">
    <div id="map" aria-label="ちず"></div>
    <div id="banner" class="banner" hidden></div>
    <div class="layer-switch" id="layer-switch" role="group" aria-label="ちずの しゅるい"></div>
    <button id="btn-locate" class="fab-locate" aria-label="いまの ばしょ">📍</button>
    <button id="btn-add" class="fab-add">＋ みつけた！</button>
  </main>
</div>
<div id="screens"></div>
<div id="modal-root"></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<noscript>JavaScript を オンに してね。</noscript>
<script src="vendor/leaflet/leaflet.js"></script>
<script src="vendor/markercluster/leaflet.markercluster.js"></script>
<script src="vendor/jszip.min.js"></script>
<script src="app.js"></script>
</body>
</html>
